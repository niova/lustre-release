name: Build Lustre Server RPMs (Rocky Linux 10.2)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]

jobs:
  build-server-rpms:
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:10.2
    steps:
      - name: Install base build tooling
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf groupinstall -y "Development Tools"
          dnf install -y \
            gcc autoconf automake libtool which make patch diffutils file \
            rpm-build redhat-rpm-config \
            binutils-devel python3 python3-devel elfutils-devel \
            libselinux-devel libaio-devel bc bison flex \
            libyaml-devel libnl3-devel libmount-devel \
            json-c-devel libssh-devel libattr-devel \
            libuuid-devel \
            checkpolicy policycoreutils systemd-devel \
            kernel-devel kernel-headers kernel-rpm-macros \
            git
          # Install the base "kernel" package without running its
          # post-install scriptlets (dracut/grubby), which assume a real
          # bootable system and fail inside a container. We only need the
          # package present to satisfy lustre.spec's "Requires: kernel"
          # build dependency check, not to actually boot it.
          dnf install -y --setopt=tsflags=noscripts kernel

      - name: Checkout Lustre source
        uses: actions/checkout@v4

      - name: Build and install e2fsprogs (Lustre-patched)
        run: |
          git clone --depth 1 -b v1.47.3-wc2 \
            git://review.whamcloud.com/tools/e2fsprogs.git
          cd e2fsprogs
          ./configure --with-root-prefix=/usr --enable-elf-shlibs \
            --libdir=/usr/lib64 \
            --disable-uuidd --disable-fsck \
            --disable-e2initrd-helper \
            --disable-libblkid --disable-libuuid \
            --disable-fuse2fs
          make -j"$(nproc)"
          make install
          cd ..
          rm -rf e2fsprogs

      - name: Configure Lustre (compile sanity check only)
        run: |
          # NOTE: this job builds against the *stock*, unpatched Rocky
          # 10.2 kernel-devel package. Lustre's ldiskfs server support
          # requires the ext4 kernel source to have the ldiskfs patch
          # series (ldiskfs/kernel_patches/series/ldiskfs-6.12-rhel10.2.series)
          # applied first -- something configure/make cannot do against
          # an already-built, installed kernel-devel package. Because of
          # this, --enable-server/--enable-ldiskfs cannot succeed here;
          # HAVE_SERVER_SUPPORT will not be set and the resulting RPMs
          # will only contain client/userspace bits.
          #
          # This job therefore only validates that the Lustre source
          # still configures and compiles cleanly against a current
          # kernel. For real, installable ldiskfs *server* RPMs, see the
          # build-server-rpms-patched-kernel job below, which builds a
          # patched kernel via contrib/lbuild.
          #
          # Leaving --disable-client out (the default is client enabled)
          # keeps client+module support self-consistent against an
          # unpatched kernel. Combining --disable-client with server
          # support silently falling back to "no" here produced an
          # inconsistent module set and broke the kmod-devel/lustre-client-
          # devel %files generation in lustre.spec.in.
          #
          # --disable-shared must NOT be used: lustre.spec.in only
          # creates/populates lustre-devel.files inside its "%if %{with
          # shared}" block in %install (see liblnetconfig.so lines). With
          # shared libs disabled that file is never created, and
          # "%files devel -f lustre-devel.files" then fails rpmbuild with
          # "Could not open %files file lustre-devel.files: No such file
          # or directory".
          sh autogen.sh
          KDIR="/usr/src/kernels/$(ls /usr/src/kernels)"
          ./configure \
            --with-linux="${KDIR}" \
            --with-linux-obj="${KDIR}" \
            --disable-gss \
            --disable-crypto

      - name: Build RPMs (client/userspace only)
        run: |
          make rpms

      - name: Collect RPMs (mirror downloads.whamcloud.com layout)
        run: |
          # Mirrors the upstream layout, e.g.:
          # https://downloads.whamcloud.com/public/lustre/latest-release/el8.10/server/RPMS/x86_64/
          mkdir -p artifacts/el10.2/server/RPMS/x86_64
          mkdir -p artifacts/el10.2/server/SRPMS
          find . -maxdepth 3 -name "*.src.rpm" \
            -exec cp -v {} artifacts/el10.2/server/SRPMS/ \;
          find . -maxdepth 3 -name "*.rpm" ! -name "*.src.rpm" \
            -exec cp -v {} artifacts/el10.2/server/RPMS/x86_64/ \;

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lustre-server-rpms-rocky10.2
          path: artifacts/el10.2/**
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Deployable RPMs: builds a real patched kernel (kernel-lustre) with the
  # ldiskfs/ext4 patch series for rhel10.2 applied, using Lustre's own
  # "lbuild" release tool (contrib/lbuild). This is what is required if
  # the resulting RPMs are meant to be installed on an actual OSS/MDS.
  #
  # NOTE: this job downloads a full kernel SRPM from the CentOS Stream 10
  # mirror and rebuilds the kernel, so it is slow (likely 1+ hour) and
  # depends on network/mirror availability. It is intentionally manual
  # (workflow_dispatch) only, rather than running on every push/PR.
  # It has not been validated end-to-end in this environment; treat the
  # first run as a trial and inspect logs closely.
  # ---------------------------------------------------------------------
  build-server-rpms-patched-kernel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:10.2
    steps:
      - name: Install base build tooling
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          # quilt is not in Rocky 10's base/AppStream/CRB repos; pull it
          # from EPEL instead.
          dnf install -y epel-release
          dnf groupinstall -y "Development Tools"
          dnf install -y \
            gcc autoconf automake libtool which make patch diffutils file \
            rpm-build rpmdevtools redhat-rpm-config quilt \
            binutils-devel python3 python3-devel elfutils-devel \
            libselinux-devel libaio-devel bc bison flex \
            libyaml-devel libnl3-devel libmount-devel \
            json-c-devel libssh-devel libattr-devel \
            libuuid-devel \
            ncurses-devel openssl-devel dwarves \
            git curl
          # lsb_release (redhat-lsb-core) is not packaged for RHEL/Rocky
          # 10 (LSB is deprecated); contrib/lbuild/lbuild-rhel only uses
          # it to special-case real RHEL (vs. clones) for a sudo
          # yumdownloader rule, and tolerates it being absent (empty
          # command substitution just skips the "sudo" branch), so it is
          # intentionally omitted here rather than installed.

      - name: Checkout Lustre source
        uses: actions/checkout@v4

      - name: Build and install e2fsprogs (Lustre-patched)
        run: |
          git clone --depth 1 -b v1.47.3-wc2 \
            git://review.whamcloud.com/tools/e2fsprogs.git
          cd e2fsprogs
          ./configure --with-root-prefix=/usr --enable-elf-shlibs \
            --libdir=/usr/lib64 \
            --disable-uuidd --disable-fsck \
            --disable-e2initrd-helper \
            --disable-libblkid --disable-libuuid \
            --disable-fuse2fs
          make -j"$(nproc)"
          make install
          cd ..
          rm -rf e2fsprogs

      - name: Create Lustre source tarball
        run: |
          # actions/checkout in a container runs as a different uid than
          # the one that owns the checked-out files on the host, which
          # git treats as "dubious ownership" and refuses to operate on.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix=lustre-source/ \
            -o /tmp/lustre-source.tar.gz HEAD

      - name: Build patched kernel + ldiskfs server RPMs via lbuild
        run: |
          # lbuild requires a --kerneltree/--kerneldir staging directory
          # even when it is going to download the kernel SRPM itself
          # (it uses the dir as the download/cache destination).
          mkdir -p /tmp/lbuild-work /tmp/kernel-tree
          cd /tmp/lbuild-work
          "${GITHUB_WORKSPACE}/contrib/lbuild/lbuild" \
            --target=6.12-rhel10.2 \
            --distro=rhel10.2 \
            --kerneltree=/tmp/kernel-tree \
            --lustre=/tmp/lustre-source.tar.gz \
            --disable-zfs \
            -- --disable-gss --disable-crypto

      - name: Collect RPMs (mirror downloads.whamcloud.com layout)
        run: |
          # Mirrors the upstream layout, e.g.:
          # https://downloads.whamcloud.com/public/lustre/latest-release/el8.10/server/RPMS/x86_64/
          # (patched kernel RPMs and lustre/kmod RPMs are published side by
          # side in the same RPMS/x86_64 directory upstream, so we do the
          # same here rather than splitting them into separate dirs)
          mkdir -p artifacts/el10.2/server/RPMS/x86_64
          mkdir -p artifacts/el10.2/server/SRPMS
          find /tmp/lbuild-work -maxdepth 4 -name "*.src.rpm" \
            -exec cp -v {} artifacts/el10.2/server/SRPMS/ \;
          find /tmp/lbuild-work -maxdepth 4 -name "*.rpm" ! -name "*.src.rpm" \
            -exec cp -v {} artifacts/el10.2/server/RPMS/x86_64/ \;

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lustre-server-rpms-rocky10.2-patched-kernel
          path: artifacts/el10.2/**
          if-no-files-found: error
